[tool.ruff]
# Same as Flake8 max-line-length
line-length = 79
exclude = [
  ".git",
  ".tox",
]

[tool.ruff.lint]
# Enable Flake8 rules (E, W, F) by default
select = ["E", "W", "F", "C90"]
# Emulate your old ignores
ignore = ["E203", "E231", "E266", "E501", "F403", "F401"]
[tool.ruff.lint.mccabe]
max-complexity = 19

[tool.tox]
legacy_tox_ini = '''
[tox]
envlist = style

[testenv:style]
deps =
	pre-commit
commands = pre-commit run --all-files
'''
